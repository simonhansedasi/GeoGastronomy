# Reference copy. Real config lives on the Hetzner box, generated by
# certbot from an initial HTTP-only block (same pattern as
# grape-expectations/library-displays/dnd-dates) -- see lab_infra's
# hetzner_services.md. Do not paste this over the live file blindly.

server {
    server_name kushcountry.simonhansedasi.com;
    root /var/www/kushcountry;
    index map.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kushcountry.simonhansedasi.com;
    return 301 https://$host$request_uri;
}
